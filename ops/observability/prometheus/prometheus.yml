# Prometheus config. Retention (30d) is set by --storage.tsdb.retention.time in compose.
# App/exporter metrics are scraped by Alloy and arrive via remote write (/api/v1/write).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Metrics path depends on CADDY_MODE: with GF_SERVER_SERVE_FROM_SUB_PATH=true (ip) Grafana
  # answers /metrics with 301 to the public ROOT_URL, so the target file (mounted by compose from
  # grafana_targets.<CADDY_MODE>.yml) sets __metrics_path__.
  # CrowdSec engine/LAPI metrics (:6060 inside the obs network, not published)
  - job_name: crowdsec
    static_configs:
      - targets: ["crowdsec:6060"]

  - job_name: grafana
    file_sd_configs:
      - files: ["/etc/prometheus-targets/grafana.yml"]
