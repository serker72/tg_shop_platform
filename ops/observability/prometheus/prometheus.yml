# Prometheus config. Retention (30d) is set by --storage.tsdb.retention.time in compose.
# App scrape targets (master_bot/bot_worker metrics) are added in a later wave; on a single
# host they are reachable via host.docker.internal:<published port>, on VPS 2 via VPN.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
