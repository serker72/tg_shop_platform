apiVersion: 1

# Dashboards as code: JSON files from ops/observability/grafana/dashboards
# (mounted to /etc/grafana/dashboards). Dashboards themselves are added in a later wave.
providers:
  - name: tg_shop_platform
    folder: tg_shop_platform
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
