name: ${PROJECT_NAME:-tg_shop_platform}

# Docker log rotation for every service (json-file is also what Alloy reads).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# Liveness of bots: GET /health/live on OBSERVABILITY_HTTP_PORT inside the container
# (the image has no curl/wget; the port is not published).
x-bot-healthcheck: &bot-healthcheck
  test:
    - "CMD"
    - "python"
    - "-c"
    - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('OBSERVABILITY_HTTP_PORT', '8080') + '/health/live', timeout=3)"
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

# One image for db_update/master_bot/bot_worker (same build + image name).
x-app: &app
  build:
    context: .
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      # Exported by `make up/agent-up/migrate` from ops/scripts/version.sh --env; empty when
      # compose is called directly (app then reports "<base>+unknown"). Fixed at build time.
      APP_VERSION: ${APP_VERSION:-}
      APP_COMMIT: ${APP_COMMIT:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
  image: ${PROJECT_NAME:-tg_shop_platform}-app
  env_file: ${APP_ENV_FILE:-.env}
  restart: unless-stopped
  logging: *logging
  # db_update/master_bot/bot_worker (idle ~140 MiB)
  mem_limit: ${APP_MEM_LIMIT:-384m}

services:
  postgres:
    build: ./ops/postgres
    image: ${PROJECT_NAME:-tg_shop_platform}-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_partman_bgw"
      - "-c"
      - "pg_partman_bgw.interval=3600"
      - "-c"
      - "pg_partman_bgw.role=${POSTGRES_USER}"
      - "-c"
      - "pg_partman_bgw.dbname=${POSTGRES_DB}"
      # Memory/WAL tuning (PostgreSQL 17 docs, "Resource Consumption"/"WAL"). Defaults = prod start
      # of VPS 1 (8 GB RAM, PG_MEM_LIMIT 2g): shared_buffers ~25% of the PG budget, see .env.example.
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-4MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-50}"
      - "-c"
      - "wal_compression=${PG_WAL_COMPRESSION:-lz4}"
      - "-c"
      - "checkpoint_completion_target=${PG_CHECKPOINT_COMPLETION_TARGET:-0.9}"
      - "-c"
      - "max_wal_size=${PG_MAX_WAL_SIZE:-2GB}"
      # Each autovacuum worker (autovacuum_max_workers=3) may use this much; the default -1 would
      # take maintenance_work_mem. Memory budget formula: .env.example (PG_*).
      - "-c"
      - "autovacuum_work_mem=${PG_AUTOVACUUM_WORK_MEM:-64MB}"
    # Docker default /dev/shm is 64 MB: parallel workers allocate DSM there.
    shm_size: ${PG_SHM_SIZE:-256m}
    mem_limit: ${PG_MEM_LIMIT:-2g}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR не задан — скопируйте .env.example в .env и укажите каталог данных}
        target: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    logging: *logging
    # Password is passed via env and written to a config file, so it is not visible
    # in `docker inspect` Cmd/Args or `ps`. REDISCLI_AUTH is also used by the healthcheck.
    # `\` and `"` are escaped for the redis config quoted string. The official
    # docker-entrypoint.sh drops privileges to the redis user only for `redis-server`.
    # `rm -f` first: on restart the old redis-owned /tmp/redis.conf survives, and with the
    # host sysctl fs.protected_regular>=1 even root may not O_CREAT-open another user's file
    # in the sticky /tmp ("can't create /tmp/redis.conf: Permission denied").
    command:
      - "sh"
      - "-c"
      - >-
        umask 077
        && rm -f /tmp/redis.conf
        && printf 'requirepass "%s"\nappendonly yes\nmaxmemory ${REDIS_MAXMEMORY:-256mb}\nmaxmemory-policy noeviction\n'
        "$$(printf '%s' "$$REDISCLI_AUTH" | sed 's/[\\"]/\\&/g')" > /tmp/redis.conf
        && chown redis:redis /tmp/redis.conf
        && exec docker-entrypoint.sh redis-server /tmp/redis.conf
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD не задан}
    # maxmemory (above) < mem_limit: room for AOF rewrite fork and client buffers.
    # noeviction is kept on purpose (permission cache/sessions): at the limit writes fail with OOM.
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    volumes:
      - type: bind
        source: ${REDIS_DATA_DIR:?REDIS_DATA_DIR не задан — скопируйте .env.example в .env и укажите каталог данных}
        target: /data
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    # rabbitmq_prometheus is enabled in this image (metrics on :15692, scraped by Alloy;
    # the port is not published).
    image: rabbitmq:4.3-management
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER не задан}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - type: bind
        source: ${RABBITMQ_DATA_DIR:?RABBITMQ_DATA_DIR не задан — скопируйте .env.example в .env и укажите каталог данных}
        target: /var/lib/rabbitmq
      - type: bind
        source: ./ops/rabbitmq/conf.d/20-memory.conf
        target: /etc/rabbitmq/conf.d/20-memory.conf
        read_only: true
    ports:
      - "127.0.0.1:${RABBITMQ_PORT_HOST:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT_HOST:-15672}:15672"
    # vm_memory_high_watermark is set absolute in ops/rabbitmq/conf.d/20-memory.conf
    # (below mem_limit; an absolute threshold is recommended for containers, rabbitmq.com/docs/memory).
    mem_limit: ${RABBITMQ_MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  minio:
    # Upstream minio/minio images are no longer published/maintained and the MinIO community
    # edition is source-only, so we use the pgsty community fork pinned by tag + digest.
    # The image contains curl (used by the healthcheck) and mc.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    restart: unless-stopped
    logging: *logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY не задан}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY не задан}
    volumes:
      - type: bind
        source: ${MINIO_DATA_DIR:?MINIO_DATA_DIR не задан — скопируйте .env.example в .env и укажите каталог данных}
        target: /data
    ports:
      - "127.0.0.1:${MINIO_API_PORT_HOST:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    mem_limit: ${MINIO_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-off job: creates the application buckets in MinIO (idempotent, mc mb --ignore-existing).
  # Same image as `minio` (it ships mc). Main bucket = STORAGE_BUCKET or MINIO_BUCKET (as
  # StorageSettings.resolved_bucket); MINIO_AUDIT_ARCHIVE_BUCKET is created when set and different.
  # STORAGE_BACKEND=s3: buckets are managed outside the platform -> exits 0 without changes.
  minio_init:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    restart: "no"
    logging: *logging
    mem_limit: ${MINIO_INIT_MEM_LIMIT:-128m}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY не задан}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY не задан}
      MINIO_BUCKET: ${MINIO_BUCKET:-tg-shop}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      MINIO_AUDIT_ARCHIVE_BUCKET: ${MINIO_AUDIT_ARCHIVE_BUCKET:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        if [ "$$STORAGE_BACKEND" = "s3" ]; then
          echo "minio_init: STORAGE_BACKEND=s3 - buckets are managed outside the platform, nothing to do"
          exit 0
        fi
        main="$${STORAGE_BUCKET:-$$MINIO_BUCKET}"
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" >/dev/null
        mc mb --ignore-existing "local/$$main"
        audit="$${MINIO_AUDIT_ARCHIVE_BUCKET:-}"
        if [ -n "$$audit" ] && [ "$$audit" != "$$main" ]; then
          mc mb --ignore-existing "local/$$audit"
        fi
        echo "minio_init: buckets ready"

  db_update:
    <<: *app
    command: ["sh", "ops/scripts/migrate.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      # The audit archiver (`make archive-audit`) runs on this service and needs the bucket.
      minio_init:
        condition: service_completed_successfully
    # Same logs bind mount as the bots: one-off jobs (`make archive-audit`, retention)
    # run on this service and must see /app/logs (log files, tmp dir, locks).
    volumes:
      - type: bind
        source: ${LOGS_DATA_DIR:?LOGS_DATA_DIR не задан — скопируйте .env.example в .env и укажите каталог данных}
        target: /app/logs

  master_bot:
    <<: *app
    command: ["python", "-m", "app.entrypoints.master_bot"]
    healthcheck: *bot-healthcheck
    # > polling stop (10 s) + LogBuffer drain (LOGS buffer_shutdown_timeout, 10 s)
    # + telemetry/Sentry flush.
    stop_grace_period: 30s
    depends_on:
      db_update:
        condition: service_completed_successfully
      minio_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${LOGS_DATA_DIR:?LOGS_DATA_DIR не задан — скопируйте .env.example в .env и укажите каталог данных}
        target: /app/logs

  bot_worker:
    <<: *app
    command: ["python", "-m", "app.entrypoints.bot_worker"]
    healthcheck: *bot-healthcheck
    # Runtime (12 s) + scheduler/relay (up to 6 s) + broker (18 s)
    # + default LogBuffer (10 s) + observability/telemetry and cancellation margin.
    stop_grace_period: 65s
    depends_on:
      db_update:
        condition: service_completed_successfully
      minio_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${LOGS_DATA_DIR:?LOGS_DATA_DIR не задан — скопируйте .env.example в .env и укажите каталог данных}
        target: /app/logs

  # Collection agent (Stage 2): Docker logs -> Loki, exporters/app metrics -> Prometheus
  # remote write. Starts only with the `observability` profile (make agent-up).
  # Single host: make agent-up with ALLOY_SINGLE_HOST=1 adds
  # ops/observability/alloy/compose.single-host.yml (joins the obs stack network).
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.11.3@sha256:8c7256f412feb9f5f48f9f6f9394dc97ca887f63dea9304f347970ecc1787669}
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "--disable-reporting"
      - "/etc/alloy/config.alloy"
    # Only the variables Alloy needs (not the whole .env).
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-tg_shop_platform}
      PROJECT_ENVIRONMENT: ${PROJECT_ENVIRONMENT:-loc}
      ALLOY_HOST_LABEL: ${ALLOY_HOST_LABEL:-}
      OBS_LOKI_PUSH_URL: ${OBS_LOKI_PUSH_URL:-}
      OBS_PROMETHEUS_REMOTE_WRITE_URL: ${OBS_PROMETHEUS_REMOTE_WRITE_URL:-}
      OBS_TEMPO_OTLP_ENDPOINT: ${OBS_TEMPO_OTLP_ENDPOINT:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_MONITORING_USER: ${POSTGRES_MONITORING_USER:-monitoring}
      POSTGRES_MONITORING_PASSWORD: ${POSTGRES_MONITORING_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OBSERVABILITY_HTTP_PORT: ${OBSERVABILITY_HTTP_PORT:-8080}
      DOCKER_HOST_URL: ${DOCKER_HOST_URL:-tcp://docker-socket-proxy:2375}
    # Docker API only via the read-only proxy (no docker.sock in this container).
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - default
      - docker_api
    volumes:
      - type: bind
        source: ./ops/observability/alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: bind
        source: ./ops/observability/alloy/postgres_queries.yml
        target: /etc/alloy/postgres_queries.yml
        read_only: true
      - type: bind
        source: ${ALLOY_DATA_DIR:?ALLOY_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /var/lib/alloy/data
      # node exporter: host proc/sys/rootfs
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          propagation: rslave
    # OTLP receiver for the app (gRPC / HTTP): compose networks only, NOT published to the host.
    expose:
      - "4317"
      - "4318"
    ports:
      # Alloy UI / debug (127.0.0.1 only)
      - "127.0.0.1:${ALLOY_PORT_HOST:-12345}:12345"
    healthcheck:
      # the image has no curl/wget: plain HTTP over bash /dev/tcp
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: ${ALLOY_MEM_LIMIT:-512m}

  # Docker events sidecar: container oom/die/restart/kill -> one JSON line per event in stdout
  # (collected by Alloy like any container log: {service="docker-events"}, label action).
  # Docker API only via docker-socket-proxy (GET /events, EVENTS=1): no docker.sock, no caps.
  # Healthcheck: heartbeat file touched on every successful (re)connect of the stream.
  docker-events:
    build:
      context: ./ops/observability/docker-events
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1m
    environment:
      DOCKER_EVENTS_URL: ${DOCKER_EVENTS_URL:-http://docker-socket-proxy:2375}
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - docker_api
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/docker-events.alive') > 180)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${DOCKER_EVENTS_MEM_LIMIT:-32m}

  # Read-only Docker API for Alloy (discovery.docker, loki.source.docker). HAProxy in front of
  # docker.sock: only GET to the allowed path groups below, everything else -> 403.
  # Not published; reachable only from the internal network docker_api (alloy only).
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.1@sha256:3400c429c5f9e1b21d62130fb93b16e2e772d4fb7695bd52fc2b743800b9fe9e}
    profiles: ["observability"]
    restart: unless-stopped
    logging: *logging
    environment:
      # GET /containers/json, /containers/{id}/json, /containers/{id}/logs
      CONTAINERS: 1
      # GET /networks: discovery.docker computes network labels (403 without it, verified)
      NETWORKS: 1
      # GET /events
      EVENTS: 1
      # GET /_ping, /version: API version negotiation of the Docker client + healthcheck
      PING: 1
      VERSION: 1
      INFO: 0
      # everything except GET is denied (no create/start/exec/...)
      POST: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      IMAGES: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks:
      - docker_api
    healthcheck:
      # busybox wget is present in the image
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: ${DOCKER_SOCKET_PROXY_MEM_LIMIT:-64m}

networks:
  default: {}
  # proxy <-> alloy only; internal: no outbound traffic
  docker_api:
    internal: true
