# Observability stack (Stage 2): Loki, Prometheus, Alertmanager, Grafana, GlitchTip, Caddy.
# Target host: VPS 2. Locally it runs next to docker-compose.yml on the same machine.
#   make obs-up / obs-down / obs-logs / obs-config   (ENV_FILE=.env.test for the test copy)
#
# Network: own compose network (no shared external network). Everything except Caddy is
# published only on 127.0.0.1:${*_PORT_HOST} (Loki/Prometheus/GlitchTip ingest: on
# ${OBS_INGEST_BIND_ADDRESS}, VPN IP in production); the app stack talks to Loki/Prometheus via
# host ports (and later via VPN on VPS 2). Prometheus resolves host.docker.internal to the
# host gateway to scrape app metrics published on the host.
# Storage: only bind mounts (${OBS_*_DATA_DIR:?}), created by `make init-dirs`.
# Grafana/Loki/Prometheus/Alertmanager run as APP_UID:APP_GID, so their dirs stay owned by
# the host user (no sudo/chown needed). Postgres/Valkey/Caddy entrypoints manage own dirs.
# Images are pinned by tag + digest and can be overridden with *_IMAGE.
name: ${PROJECT_NAME:-tg_shop_platform}_obs

# Docker log rotation for every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

x-glitchtip: &glitchtip
  image: ${GLITCHTIP_IMAGE:-glitchtip/glitchtip:v5.1@sha256:805f4fb7b886653b944caff1ae06a95c8724b5b3ddc21917e80e18e6c03019ab}
  restart: unless-stopped
  logging: *logging
  environment: &glitchtip-env
    # Passwords are interpolated into URLs: use URL-safe values (e.g. `openssl rand -hex 24`).
    DATABASE_URL: postgres://${OBS_POSTGRES_USER:-glitchtip}:${OBS_POSTGRES_PASSWORD:?OBS_POSTGRES_PASSWORD не задан}@obs-postgres:5432/${OBS_POSTGRES_DB:-glitchtip}
    REDIS_URL: redis://:${OBS_REDIS_PASSWORD:?OBS_REDIS_PASSWORD не задан}@obs-redis:6379/0
    SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?GLITCHTIP_SECRET_KEY не задан}
    PORT: "8000"
    # Public URL behind Caddy; computed by the Makefile (ops/scripts/obs_mode.sh) from CADDY_MODE.
    GLITCHTIP_DOMAIN: ${GLITCHTIP_PUBLIC_URL:-https://${VPS_IP:-127.0.0.1}:${CADDY_HTTPS_PORT_HOST:-443}}
    DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
    # consolemail:// = e-mails are only written to the container log
    EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
    GLITCHTIP_MAX_EVENT_LIFE_DAYS: ${GLITCHTIP_MAX_EVENT_LIFE_DAYS:-30}
    ENABLE_USER_REGISTRATION: ${GLITCHTIP_ENABLE_USER_REGISTRATION:-false}
    ENABLE_ORGANIZATION_CREATION: ${GLITCHTIP_ENABLE_ORGANIZATION_CREATION:-false}
    CELERY_WORKER_AUTOSCALE: "1,3"
    CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"

services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6}
    restart: unless-stopped
    logging: *logging
    user: "${APP_UID:?APP_UID не задан}:${APP_GID:?APP_GID не задан}"
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - type: bind
        source: ./ops/observability/loki/config.yml
        target: /etc/loki/config.yml
        read_only: true
      - type: bind
        source: ${OBS_LOKI_DATA_DIR:?OBS_LOKI_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /loki
    ports:
      # Ingest endpoint for Alloy of VPS 1: OBS_INGEST_BIND_ADDRESS = VPN IP of VPS 2 in prod.
      - "${OBS_INGEST_BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT_HOST:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64}
    restart: unless-stopped
    logging: *logging
    user: "${APP_UID:?APP_UID не задан}:${APP_GID:?APP_GID не задан}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--web.enable-lifecycle"
      # metrics from Alloy (VPS 1) arrive via /api/v1/write
      - "--web.enable-remote-write-receiver"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./ops/observability/prometheus
        target: /etc/prometheus
        read_only: true
      # Grafana metrics path for the current CADDY_MODE (sub path in ip mode)
      - type: bind
        source: ./ops/observability/prometheus/grafana_targets.${CADDY_MODE:-ip}.yml
        target: /etc/prometheus-targets/grafana.yml
        read_only: true
      - type: bind
        source: ${OBS_PROMETHEUS_DATA_DIR:?OBS_PROMETHEUS_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /prometheus
    ports:
      # Ingest endpoint for Alloy of VPS 1 (see Loki above).
      - "${OBS_INGEST_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT_HOST:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba}
    restart: unless-stopped
    logging: *logging
    user: "${APP_UID:?APP_UID не задан}:${APP_GID:?APP_GID не задан}"
    # Alertmanager does not expand env in its config: render the template into /tmp.
    # The bot token goes to a 0600 file (bot_token_file), not into the config or argv.
    # Without ALERT_TELEGRAM_BOT_TOKEN/CHAT_ID the telegram block is dropped (alerts -> blackhole).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e; umask 077;
        src=/etc/alertmanager-src/alertmanager.yml; dst=/tmp/alertmanager.yml;
        if [ -n "$$ALERT_TELEGRAM_BOT_TOKEN" ] && [ -n "$$ALERT_TELEGRAM_CHAT_ID" ]; then
        case "$$ALERT_TELEGRAM_CHAT_ID" in -*[!0-9]*|*[!-0-9]*|-|'') echo "ALERT_TELEGRAM_CHAT_ID must be an integer" >&2; exit 1;; esac;
        printf '%s' "$$ALERT_TELEGRAM_BOT_TOKEN" > /tmp/telegram_bot_token;
        sed -e "s/__TELEGRAM_CHAT_ID__/$$ALERT_TELEGRAM_CHAT_ID/" -e "s/__DEFAULT_RECEIVER__/telegram/" "$$src" > "$$dst";
        else
        echo "WARN: ALERT_TELEGRAM_BOT_TOKEN/ALERT_TELEGRAM_CHAT_ID empty, alerts go to blackhole" >&2;
        sed -e '/# BEGIN telegram/,/# END telegram/d' -e "s/__DEFAULT_RECEIVER__/blackhole/" "$$src" > "$$dst";
        fi;
        exec /bin/alertmanager --config.file="$$dst" --storage.path=/alertmanager
        --data.retention=${ALERTMANAGER_RETENTION:-720h}
    environment:
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - type: bind
        source: ./ops/observability/alertmanager
        target: /etc/alertmanager-src
        read_only: true
      - type: bind
        source: ${OBS_ALERTMANAGER_DATA_DIR:?OBS_ALERTMANAGER_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT_HOST:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7}
    restart: unless-stopped
    logging: *logging
    user: "${APP_UID:?APP_UID не задан}:${APP_GID:?APP_GID не задан}"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан}
      # Computed by the Makefile (ops/scripts/obs_mode.sh) from CADDY_MODE:
      # ip -> https://<VPS_IP>:<port>/grafana/ + sub path; domain -> https://<GRAFANA_DOMAIN>:<port>/
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${VPS_IP:-127.0.0.1}:${CADDY_HTTPS_PORT_HOST:-443}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-true}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - type: bind
        source: ./ops/observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./ops/observability/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
      - type: bind
        source: ${OBS_GRAFANA_DATA_DIR:?OBS_GRAFANA_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT_HOST:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      # /api/health answers 200 without the prefix in both modes (checked with sub path on)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  obs-postgres:
    image: ${OBS_POSTGRES_IMAGE:-postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${OBS_POSTGRES_USER:-glitchtip}
      POSTGRES_PASSWORD: ${OBS_POSTGRES_PASSWORD:?OBS_POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${OBS_POSTGRES_DB:-glitchtip}
    volumes:
      - type: bind
        source: ${OBS_POSTGRES_DATA_DIR:?OBS_POSTGRES_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  obs-redis:
    image: ${OBS_REDIS_IMAGE:-valkey/valkey:8.1-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a}
    restart: unless-stopped
    logging: *logging
    # Same approach as redis in docker-compose.yml: password goes to a config file, not argv.
    command:
      - "sh"
      - "-c"
      - >-
        umask 077
        && printf 'requirepass "%s"\nappendonly yes\n'
        "$$(printf '%s' "$$REDISCLI_AUTH" | sed 's/[\\"]/\\&/g')" > /tmp/valkey.conf
        && chown valkey:valkey /tmp/valkey.conf
        && exec docker-entrypoint.sh valkey-server /tmp/valkey.conf
    environment:
      REDISCLI_AUTH: ${OBS_REDIS_PASSWORD:?OBS_REDIS_PASSWORD не задан}
    volumes:
      - type: bind
        source: ${OBS_REDIS_DATA_DIR:?OBS_REDIS_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Official GlitchTip layout: one-shot migrate + web + celery worker with beat.
  glitchtip-migrate:
    <<: *glitchtip
    restart: "no"
    command: ["./bin/run-migrate.sh"]
    depends_on:
      obs-postgres:
        condition: service_healthy
      obs-redis:
        condition: service_healthy

  glitchtip-web:
    <<: *glitchtip
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    ports:
      # Sentry SDK of VPS 1 sends events over VPN (like Loki/Prometheus ingest), see docs/ops/network.md
      - "${OBS_INGEST_BIND_ADDRESS:-127.0.0.1}:${GLITCHTIP_PORT_HOST:-8000}:8000"
    healthcheck:
      # The image has neither curl nor wget.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health/', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot idempotent bootstrap (superuser/organization/team/project/key from GLITCHTIP_*).
  # Profile `bootstrap`: started by `make obs-bootstrap` (part of `make obs-up`) via
  # `run --rm`, which also writes SENTRY_DSN to the env file. Values are checked by the script.
  glitchtip-bootstrap:
    <<: *glitchtip
    restart: "no"
    profiles: ["bootstrap"]
    command: ["./manage.py", "shell", "-c", "exec(open('/bootstrap/bootstrap.py').read())"]
    environment:
      <<: *glitchtip-env
      GLITCHTIP_ADMIN_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:-}
      GLITCHTIP_ADMIN_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:-}
      GLITCHTIP_ORG_SLUG: ${GLITCHTIP_ORG_SLUG:-}
      GLITCHTIP_ORG_NAME: ${GLITCHTIP_ORG_NAME:-}
      GLITCHTIP_TEAM_SLUG: ${GLITCHTIP_TEAM_SLUG:-}
      GLITCHTIP_PROJECT_NAME: ${GLITCHTIP_PROJECT_NAME:-}
      GLITCHTIP_PROJECT_PLATFORM: ${GLITCHTIP_PROJECT_PLATFORM:-python}
      GLITCHTIP_PROJECT_PUBLIC_KEY: ${GLITCHTIP_PROJECT_PUBLIC_KEY:-}
    volumes:
      - type: bind
        source: ./ops/observability/glitchtip
        target: /bootstrap
        read_only: true
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully

  glitchtip-worker:
    <<: *glitchtip
    command: ["./bin/run-celery-with-beat.sh"]
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A glitchtip inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  # CrowdSec security engine + LAPI: reads only the JSON access log of Caddy (no Docker access),
  # decisions are pulled by the bouncer inside Caddy. LAPI 8080 is NOT published on the host.
  crowdsec:
    image: ${CROWDSEC_IMAGE:-crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4}
    restart: unless-stopped
    logging: *logging
    environment:
      # caddy parser + base-http-scenarios (http-generic-bf: Basic Auth 401s, probing, ...) + http-cve
      COLLECTIONS: crowdsecurity/caddy
      # Registered at start with this key (also used by the bouncer in Caddy)
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY не задан — добавьте в .env CROWDSEC_BOUNCER_KEY=<вывод openssl rand -hex 32>}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${OBS_CROWDSEC_DATA_DIR:?OBS_CROWDSEC_DATA_DIR не задан — см. .env.example, затем make init-dirs}/config
        target: /etc/crowdsec
      - type: bind
        source: ${OBS_CROWDSEC_DATA_DIR:?OBS_CROWDSEC_DATA_DIR не задан}/data
        target: /var/lib/crowdsec/data
      - type: bind
        source: ./ops/observability/crowdsec/acquis.d/caddy.yaml
        target: /etc/crowdsec/acquis.d/caddy.yaml
        read_only: true
      - type: bind
        source: ./ops/observability/crowdsec/parsers/s02-enrich/tgsp-whitelist.yaml
        target: /etc/crowdsec/parsers/s02-enrich/tgsp-whitelist.yaml
        read_only: true
      - type: bind
        source: ${OBS_CADDY_LOGS_DIR:?OBS_CADDY_LOGS_DIR не задан — см. .env.example, затем make init-dirs}
        target: /var/log/caddy
        read_only: true
    # Prometheus metrics on :6060 inside the obs network (scraped by prometheus, not published)
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  caddy:
    # Own build: official Caddy + CrowdSec bouncer module (ops/observability/caddy/Dockerfile).
    build:
      context: ./ops/observability/caddy
      args:
        # Go module mirrors for xcaddy (see .env.example: CADDY_BUILD_GOPROXY/GOSUMDB)
        GOPROXY: ${CADDY_BUILD_GOPROXY:-https://goproxy.cn|https://proxy.golang.org|direct}
        GOSUMDB: ${CADDY_BUILD_GOSUMDB:-sum.golang.org}
    image: ${PROJECT_NAME:-tg_shop_platform}-obs-caddy:2.10.2-crowdsec-v0.13.0
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    environment:
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?CROWDSEC_BOUNCER_KEY не задан — добавьте в .env CROWDSEC_BOUNCER_KEY=<вывод openssl rand -hex 32>}
      # Basic Auth in front of everything (base64 bcrypt hash, see Caddyfile.*)
      OBS_AUTH_USER: ${OBS_AUTH_USER:?OBS_AUTH_USER не задан}
      OBS_AUTH_HASH: ${OBS_AUTH_HASH:?OBS_AUTH_HASH не задан — выполните make obs-auth}
      # CADDY_MODE=ip uses VPS_IP, CADDY_MODE=domain the domains (checked by make obs-up)
      VPS_IP: ${VPS_IP:-127.0.0.1}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.localhost}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-glitchtip.localhost}
      # certificates, ACME account and autosave config live in the bind-mounted dir
      XDG_DATA_HOME: /caddy/data
      XDG_CONFIG_HOME: /caddy/config
    volumes:
      - type: bind
        source: ./ops/observability/caddy/Caddyfile.${CADDY_MODE:-ip}
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${OBS_CADDY_DATA_DIR:?OBS_CADDY_DATA_DIR не задан — см. .env.example, затем make init-dirs}
        target: /caddy
      # JSON access log for CrowdSec (runtime logs stay on stdout -> Alloy)
      - type: bind
        source: ${OBS_CADDY_LOGS_DIR:?OBS_CADDY_LOGS_DIR не задан — см. .env.example, затем make init-dirs}
        target: /var/log/caddy
    ports:
      # The only service exposed beyond loopback (CADDY_BIND_ADDRESS, default 0.0.0.0).
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTP_PORT_HOST:-80}:80"
      - "${CADDY_BIND_ADDRESS:-0.0.0.0}:${CADDY_HTTPS_PORT_HOST:-443}:443"
    depends_on:
      grafana:
        condition: service_healthy
      glitchtip-web:
        condition: service_healthy
      # Fail-open bouncer: caddy serves (Basic Auth stays) even if CrowdSec is down; bans then
      # do not apply until it is back (alerts CrowdsecDown / CrowdsecBouncerNoPulls).
      crowdsec:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
