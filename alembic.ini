# Alembic configuration for tg_shop_platform.
#
# The database URL is intentionally NOT configured here (no `sqlalchemy.url`):
# `migrations/env.py` builds it from `app.core.config.Settings.database_url`, which reads
# the POSTGRES_* environment variables and the dotenv file. Keeping credentials out of a
# tracked file lets one configuration serve every environment.
#
# The project root is put on sys.path (see `prepend_sys_path`), so `import app...` works
# inside env.py. Example:
#
#     uv run alembic upgrade head

[alembic]
# Directory with env.py, script.py.mako and versions/; relative to this file.
script_location = migrations

# Project root on sys.path so `app.*` modules are importable from env.py.
prepend_sys_path = .

# Split `prepend_sys_path` / `version_locations` with the platform path separator
# ("os" is the documented portable value).
path_separator = os
version_path_separator = os

# Readable revision file names: 20260115_1200-1a2b3c4d5e6f_add_users.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate the `--autogenerate` slug to a reasonable length.
truncate_slug_length = 40

# Timestamps in `--autogenerate` messages/revisions use UTC (`local` is the default).
timezone = UTC

# No [loggers]/[handlers]/[formatters] sections on purpose: env.py calls
# `app.core.logging.configure_logging()`, so Alembic output uses the same structlog
# pipeline (stdout, one handler, idempotent) as the application instead of a second,
# divergent stdlib configuration. Passing `-q` still works: `fileConfig` is never invoked.
