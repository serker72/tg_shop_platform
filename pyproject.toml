[project]
name = "tg-shop-platform"
version = "0.1.1"
description = "Multi-tenant SaaS platform for Telegram shop bots (master bot + bot worker)"
readme = "README.md"
authors = [
    { name = "Sergey Kerimov", email = "serker72@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "aiogram-dialog>=2.6.0",
    "aiohttp>=3.11",
    "aiohttp-socks>=0.12.0",
    "alembic>=1.20.1",
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "dishka>=1.10.1",
    "faststream[otel,rabbit]>=0.7.8",
    "minio>=7.2.20",
    "opentelemetry-api~=1.45",
    "opentelemetry-exporter-otlp-proto-grpc~=1.45",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "opentelemetry-sdk~=1.45",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "sentry-sdk>=2.20",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers"]
xfail_strict = true
markers = [
    "integration: tests requiring running infrastructure (PostgreSQL, Redis, RabbitMQ, MinIO)",
    "req(*ids): requirement/scenario codes of milestones I and II (R1-R8, S1-S6, SEC1, R-II.*, S-II.*), see tests/traceability.py",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261113",
]
